<div class="dashboard-frame-wrap">
  <iframe
    class="dashboard-frame"
    src="{{ .Get "src" }}"
    title="{{ .Get "title" }}"
    loading="eager"
    scrolling="no"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
  (function () {
    var frame = document.currentScript.parentElement.querySelector(".dashboard-frame");
    window.addEventListener("message", function (event) {
      var data = event.data || {};
      if (
        event.origin === window.location.origin &&
        data.type === "srag-dashboard-height" &&
        Number.isFinite(data.height)
      ) {
        frame.style.height = Math.max(800, Math.min(5000, data.height + 8)) + "px";
      }
    });
  }());
  </script>
</div>
<style>
.dashboard-frame-wrap {
  width: min(1600px, 96vw);
  margin-left: 50%;
  transform: translateX(-50%);
}
.dashboard-frame {
  display: block;
  width: 100%;
  height: 1180px;
  border: 1px solid #dce3e8;
  border-radius: 8px;
  background: #f4f7f8;
}
@media (max-width: 720px) {
  .dashboard-frame-wrap { width: 100vw; }
  .dashboard-frame { height: 1500px; border-left: 0; border-right: 0; }
}
</style>
