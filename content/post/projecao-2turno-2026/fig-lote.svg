<svg xmlns="http://www.w3.org/2000/svg" width="680" height="276" viewBox="0 0 680 276" role="img" aria-label="Nas 1.868 urnas que chegaram primeiro ao TSE no 2º turno, Lula teve 55,5% dos votos dados a ele ou a Flávio, contra 51,8% no país. No 1º turno, essas mesmas urnas já davam a ele 53,5%, contra 49,0% no país."><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#111827}.t{font-size:23px;font-weight:600}.s{font-size:16px;fill:#4b5563}.v{font-size:17px;font-weight:600}.w{font-size:16px;font-weight:600}.m{font-size:15px;fill:#6b7280}.e{font-size:15px;fill:#4b5563}.c{font-size:17px}.n{font-variant-numeric:tabular-nums}</style><rect x="0.5" y="0.5" width="679" height="275" rx="12" fill="#ffffff" stroke="#e5e7eb"/><text x="24.0" y="40.0" class="t" text-anchor="start">Já no 1º turno, essas urnas pendiam para Lula</text><text x="24.0" y="66.0" class="s" text-anchor="start">% de Lula nos votos dados a Lula ou Flávio, nas mesmas urnas nos dois turnos</text><rect x="24" y="86" width="12" height="12" rx="2" fill="#00897b"/><text x="42.0" y="96.0" class="e" text-anchor="start">1.868 primeiras urnas do 2º turno</text><rect x="294.65" y="86" width="12" height="12" rx="2" fill="#6b7280"/><text x="312.6" y="96.0" class="e" text-anchor="start">país</text><text x="24.0" y="153.0" class="w" text-anchor="start">1º turno</text><line x1="245.5" y1="148" x2="423.5" y2="148" stroke="#9ca3af" stroke-width="2"/><circle cx="245.5" cy="148" r="7" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="245.5" y="134.0" class="e n" text-anchor="middle">49,0%</text><circle cx="423.5" cy="148" r="7" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="423.5" y="134.0" class="e n" text-anchor="middle">53,5%</text><text x="437.5" y="153.0" class="v n" text-anchor="start">+4,5 pontos</text><text x="24.0" y="209.0" class="w" text-anchor="start">2º turno</text><line x1="355.6" y1="204" x2="502.9" y2="204" stroke="#9ca3af" stroke-width="2"/><circle cx="355.6" cy="204" r="7" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="355.6" y="190.0" class="e n" text-anchor="middle">51,8%</text><circle cx="502.9" cy="204" r="7" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="502.9" y="190.0" class="e n" text-anchor="middle">55,5%</text><text x="516.9" y="209.0" class="v n" text-anchor="start">+3,7 pontos</text><text x="24.0" y="258.0" class="m" text-anchor="start">Fonte: boletins de urna do 1º e do 2º turno (TSE) · Análise: Rafael Izbicki</text></svg>
