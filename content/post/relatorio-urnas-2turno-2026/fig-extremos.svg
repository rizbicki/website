nchor="start">713</text><text x="24.0" y="313.0" class="w" text-anchor="start">2º turno de 2026</text><text x="318.0" y="298.0" class="c" text-anchor="end">Lula</text><rect x="330.0" y="280.0" width="265.8" height="24" rx="3" fill="#00897b"/><text x="605.8" y="298.0" class="v n" text-anchor="start">6.816</text><text x="318.0" y="328.0" class="c" text-anchor="end">Flávio Bolsonaro</text><rect x="330.0" y="310.0" width="14.7" height="24" rx="3" fill="#7b4fbf"/><text x="354.7" y="328.0" class="v n" text-anchor="start">378</text><text x="24.0" y="384.0" class="m" text-anchor="start">Corte estrito. No 2º turno, os votos em Lula ou no adversário são os válidos.</text><text x="24.0" y="406.0" class="m" text-anchor="start">Com 90% ou mais dos válidos, são 6.899 e 384 no 2º turno de 2026, os números do relatório.</text><text x="24.0" y="428.0" class="m" text-anchor="start">Fonte: boletins de urna (BWeb/TSE) · Análise: Rafael Izbicki</text></svg>
